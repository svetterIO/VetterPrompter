<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>VetterPrompter v1.0</title>
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(18, 18, 18, 0.92);
      --panel-2: #101010;
      --text: #f7f7f7;
      --muted: #a6a6a6;
      --border: #2a2a2a;
      --accent: #ffffff;
      --danger: #ff5d5d;
      --font-size: 64px;
      --prompter-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button, textarea, select { font: inherit; }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      background: radial-gradient(circle at top, #111 0%, #050505 42%, #020202 100%);
    }

    .toolbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      font-weight: 800;
      letter-spacing: .02em;
      margin-right: 8px;
      white-space: nowrap;
    }

    .version {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .spacer { flex: 1; }

    button {
      border: 1px solid var(--border);
      background: #171717;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      min-height: 40px;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    button:hover { background: #222; border-color: #3a3a3a; }
    button:active { transform: translateY(1px) scale(.99); }
    button.primary { background: #f2f2f2; color: #090909; border-color: #f2f2f2; font-weight: 800; }

    select {
      border: 1px solid var(--border);
      background: #171717;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 34px 8px 11px;
      min-height: 40px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: #666; }
    button.danger { color: #ffb0b0; }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid var(--border);
      background: #0d0d0d;
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
      min-height: 40px;
    }

    .stat strong { color: var(--text); font-variant-numeric: tabular-nums; }

    .stage {
      position: relative;
      overflow: hidden;
    }

    .guide {
      position: absolute;
      left: 0;
      right: 0;
      top: 48%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      pointer-events: none;
      z-index: 4;
    }

    .prompter {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      scroll-behavior: auto;
      scrollbar-width: none;
      overscroll-behavior: contain;
      padding: 42vh min(9vw, 120px) 70vh;
    }

    .prompter::-webkit-scrollbar { display: none; }

    #scriptText {
      margin: 0 auto;
      max-width: 1150px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: var(--font-size);
      font-family: var(--prompter-font);
      line-height: 1.42;
      font-weight: 700;
      letter-spacing: .01em;
      text-align: center;
      text-wrap: pretty;
    }

    .editor {
      position: absolute;
      inset: 18px;
      z-index: 10;
      display: none;
      grid-template-rows: auto 1fr auto;
      background: rgba(7, 7, 7, .97);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 80px rgba(0,0,0,.55);
      overflow: hidden;
    }

    .editor.open { display: grid; }

    .editor-header, .editor-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-color: var(--border);
      background: #0d0d0d;
    }

    .editor-header { border-bottom: 1px solid var(--border); }
    .editor-footer { border-top: 1px solid var(--border); justify-content: flex-end; }

    .editor-title { font-weight: 800; }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 20px;
      background: #090909;
      color: var(--text);
      font-size: 20px;
      line-height: 1.6;
    }

    .shortcuts {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    kbd {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid #3b3b3b;
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #191919;
      color: #eee;
      font: 600 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .mobile-help { display: none; }

    @media (max-width: 800px) {
      :root { --font-size: 44px; }
      .toolbar { padding: 8px; gap: 7px; }
      .brand { width: 100%; }
      .spacer { display: none; }
      .stat { font-size: 12px; }
      button { padding: 8px 10px; }
      .prompter { padding-left: 7vw; padding-right: 7vw; }
      .shortcuts { display: none; }
      .mobile-help { display: inline; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar" aria-label="Teleprompter controls">
      <div class="brand">VetterPrompter <span class="version" aria-label="Version 1.0, made by svetterIO">v1.0 · made by svetterIO</span></div>

      <div class="controls">
        <button id="playBtn" class="primary" type="button" title="Play/Pause (Space)">▶ Play</button>
        <button id="slowerBtn" type="button" title="Slow down (-). Hold for accelerating slowdown.">− Slower</button>
        <button id="fasterBtn" type="button" title="Speed up (+). Hold for accelerating fast-forward.">+ Faster</button>
        <button id="scrollUpBtn" type="button" title="Scroll backward (Arrow Up). Hold for continuous movement.">↑ Back</button>
        <button id="scrollDownBtn" type="button" title="Scroll forward (Arrow Down). Hold for continuous movement.">↓ Forward</button>
        <button id="smallerBtn" type="button" title="Shrink content (Ctrl/Cmd + -)">A−</button>
        <button id="largerBtn" type="button" title="Enlarge content (Ctrl/Cmd + +)">A+</button>
        <select id="fontSelect" aria-label="Teleprompter font" title="Change teleprompter font">
          <option value="system">System Sans — Recommended</option>
          <option value="verdana">Verdana — Wide & Clear</option>
          <option value="arial">Arial / Helvetica — Clean</option>
          <option value="trebuchet">Trebuchet MS — Humanist</option>
          <option value="tahoma">Tahoma — Compact & Clear</option>
          <option value="segoe">Segoe UI — Smooth</option>
          <option value="georgia">Georgia — Readable Serif</option>
        </select>
        <button id="topBtn" type="button" title="Return to top">↥ Top</button>
        <button id="editBtn" type="button">✎ Edit Script</button>
      </div>

      <div class="spacer"></div>

      <div class="stat">Speed <strong id="speedValue">60</strong> px/s</div>
      <div class="stat">Step <strong id="stepValue">5</strong> px/s</div>
      <div class="stat">Text <strong id="sizeValue">64</strong> px</div>
      <div class="shortcuts">
        <kbd>Space</kbd> play/pause &nbsp; <kbd>+</kbd>/<kbd>−</kbd> speed (hold = turbo) &nbsp; <kbd>↑</kbd>/<kbd>↓</kbd> move script &nbsp; <kbd>Ctrl</kbd>+<kbd>+</kbd>/<kbd>−</kbd> text size
      </div>
      <div class="mobile-help shortcuts">Use the buttons above to control playback.</div>
    </header>

    <section class="stage">
      <div class="guide" aria-hidden="true"></div>
      <div id="prompter" class="prompter" tabindex="0" aria-label="Teleprompter script">
        <div id="scriptText"></div>
      </div>

      <section id="editor" class="editor" aria-label="Script editor">
        <div class="editor-header">
          <div class="editor-title">Edit Script</div>
          <div class="spacer"></div>
          <span class="shortcuts">Your script is saved locally in this browser.</span>
        </div>
        <textarea id="scriptInput" spellcheck="true" aria-label="Script text"></textarea>
        <div class="editor-footer">
          <button id="cancelEditBtn" type="button">Cancel</button>
          <button id="saveEditBtn" class="primary" type="button">Save & Close</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      const DEFAULT_SCRIPT = `Welcome to your teleprompter.\n\nClick “Edit Script” to replace this text with your own.\n\nKeyboard controls:\n\n+  speeds up scrolling (hold for turbo)\n−  slows down scrolling (hold for turbo)\nSpace  plays or pauses\nCtrl + +  enlarges the text\nCtrl + −  shrinks the text\n\nYou can also use the on-screen buttons at any time.\n\nGood luck with your presentation.`;

      const MIN_SPEED = 1;
      const MAX_SPEED = 1600;
      const MIN_FONT_SIZE = 24;
      const MAX_FONT_SIZE = 140;
      const FONT_STEP = 4;
      const HOLD_DELAY_MS = 350;
      const HOLD_REPEAT_MS = 110;
      const MANUAL_SCROLL_STEP = 90;
      const MANUAL_HOLD_DELAY_MS = 280;
      const MANUAL_HOLD_REPEAT_MS = 45;

      const prompter = document.getElementById('prompter');
      const scriptText = document.getElementById('scriptText');
      const scriptInput = document.getElementById('scriptInput');
      const editor = document.getElementById('editor');

      const playBtn = document.getElementById('playBtn');
      const slowerBtn = document.getElementById('slowerBtn');
      const fasterBtn = document.getElementById('fasterBtn');
      const scrollUpBtn = document.getElementById('scrollUpBtn');
      const scrollDownBtn = document.getElementById('scrollDownBtn');
      const smallerBtn = document.getElementById('smallerBtn');
      const largerBtn = document.getElementById('largerBtn');
      const fontSelect = document.getElementById('fontSelect');
      const topBtn = document.getElementById('topBtn');
      const editBtn = document.getElementById('editBtn');
      const cancelEditBtn = document.getElementById('cancelEditBtn');
      const saveEditBtn = document.getElementById('saveEditBtn');
      const speedValue = document.getElementById('speedValue');
      const stepValue = document.getElementById('stepValue');
      const sizeValue = document.getElementById('sizeValue');

      const STORAGE_KEYS = {
        script: 'teleprompter.script',
        speed: 'teleprompter.speed',
        fontSize: 'teleprompter.fontSize',
        fontFamily: 'teleprompter.fontFamily'
      };

      let speed = clamp(Number(localStorage.getItem(STORAGE_KEYS.speed)) || 60, MIN_SPEED, MAX_SPEED);
      let fontSize = clamp(Number(localStorage.getItem(STORAGE_KEYS.fontSize)) || 64, MIN_FONT_SIZE, MAX_FONT_SIZE);
      let fontFamily = localStorage.getItem(STORAGE_KEYS.fontFamily) || 'system';

      const FONT_FAMILIES = {
        // Chosen for teleprompter readability: high x-height, open shapes,
        // strong character distinction, and reliable system availability.
        system: 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif',
        verdana: 'Verdana, Geneva, sans-serif',
        arial: 'Arial, Helvetica, "Helvetica Neue", sans-serif',
        trebuchet: '"Trebuchet MS", Trebuchet, Arial, sans-serif',
        tahoma: 'Tahoma, Verdana, "Segoe UI", sans-serif',
        segoe: '"Segoe UI", system-ui, Arial, sans-serif',
        georgia: 'Georgia, Cambria, "Times New Roman", serif'
      };

      if (!FONT_FAMILIES[fontFamily]) fontFamily = 'system';
      let playing = false;
      let lastTime = null;
      let fractionalScroll = 0;
      let holdDelayTimer = null;
      let holdRepeatTimer = null;
      let holdStartedAt = 0;
      let heldSpeedKey = null;
      let manualHoldDelayTimer = null;
      let manualHoldRepeatTimer = null;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getScript() {
        return localStorage.getItem(STORAGE_KEYS.script) || DEFAULT_SCRIPT;
      }

      function updateScript(text) {
        const clean = text.trim() || DEFAULT_SCRIPT;
        scriptText.textContent = clean;
        scriptInput.value = clean;
        localStorage.setItem(STORAGE_KEYS.script, clean);
      }

      // Smaller, precise increments at low speed; increasingly larger jumps at
      // higher speeds so + / - also behave like fast-forward / fast-rewind.
      function getSpeedStep(value = speed) {
        if (value < 20) return 1;
        if (value < 50) return 2;
        if (value < 100) return 5;
        if (value < 200) return 10;
        if (value < 400) return 25;
        if (value < 800) return 50;
        return 100;
      }

      function getHoldMultiplier() {
        const heldFor = performance.now() - holdStartedAt;
        if (heldFor < 1000) return 1;
        if (heldFor < 1800) return 2;
        if (heldFor < 2800) return 4;
        if (heldFor < 4000) return 8;
        return 16;
      }

      function updateUI() {
        speedValue.textContent = Math.round(speed);
        stepValue.textContent = getSpeedStep();
        sizeValue.textContent = Math.round(fontSize);
        document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
        document.documentElement.style.setProperty('--prompter-font', FONT_FAMILIES[fontFamily]);
        fontSelect.value = fontFamily;
        playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play';
        playBtn.setAttribute('aria-pressed', String(playing));
        localStorage.setItem(STORAGE_KEYS.speed, speed);
        localStorage.setItem(STORAGE_KEYS.fontSize, fontSize);
        localStorage.setItem(STORAGE_KEYS.fontFamily, fontFamily);
      }

      function setPlaying(value) {
        playing = value;
        lastTime = null;
        fractionalScroll = 0;
        updateUI();
      }

      function togglePlay() {
        setPlaying(!playing);
      }

      function changeSpeed(direction, multiplier = 1) {
        const step = getSpeedStep(speed) * multiplier;
        speed = clamp(speed + (direction * step), MIN_SPEED, MAX_SPEED);
        updateUI();
      }

      function changeFontSize(delta) {
        fontSize = clamp(fontSize + delta, MIN_FONT_SIZE, MAX_FONT_SIZE);
        updateUI();
      }

      function changeFontFamily(value) {
        if (!FONT_FAMILIES[value]) return;
        fontFamily = value;
        updateUI();
      }

      function manualScroll(direction, amount = MANUAL_SCROLL_STEP) {
        // Manual navigation is independent of playback speed. Reset only the
        // fractional carry so automatic scrolling resumes cleanly from the
        // newly selected position.
        fractionalScroll = 0;
        prompter.scrollTop = clamp(
          prompter.scrollTop + (direction * amount),
          0,
          Math.max(0, prompter.scrollHeight - prompter.clientHeight)
        );
      }

      function stopManualHold() {
        clearTimeout(manualHoldDelayTimer);
        clearInterval(manualHoldRepeatTimer);
        manualHoldDelayTimer = null;
        manualHoldRepeatTimer = null;
      }

      function startManualHold(direction) {
        stopManualHold();
        manualScroll(direction);
        manualHoldDelayTimer = setTimeout(() => {
          manualHoldRepeatTimer = setInterval(() => {
            manualScroll(direction, Math.max(24, Math.round(fontSize * 0.72)));
          }, MANUAL_HOLD_REPEAT_MS);
        }, MANUAL_HOLD_DELAY_MS);
      }

      function attachManualScrollButton(button, direction) {
        button.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          startManualHold(direction);
        });

        const stop = () => stopManualHold();
        button.addEventListener('pointerup', stop);
        button.addEventListener('pointercancel', stop);
        button.addEventListener('lostpointercapture', stop);

        button.addEventListener('click', (event) => {
          if (event.detail === 0) manualScroll(direction);
        });
      }

      function animate(timestamp) {
        if (playing && !editor.classList.contains('open')) {
          if (lastTime !== null) {
            const elapsedSeconds = Math.min((timestamp - lastTime) / 1000, 0.1);

            // Preserve sub-pixel movement between frames. This avoids the
            // low-speed stall that can happen when browsers round scrollTop.
            const totalMovement = (speed * elapsedSeconds) + fractionalScroll;
            const wholePixels = Math.trunc(totalMovement);
            fractionalScroll = totalMovement - wholePixels;

            if (wholePixels > 0) {
              prompter.scrollTop += wholePixels;
            }

            const atBottom = prompter.scrollTop + prompter.clientHeight >= prompter.scrollHeight - 2;
            if (atBottom) setPlaying(false);
          }
          lastTime = timestamp;
        } else {
          lastTime = null;
          fractionalScroll = 0;
        }
        requestAnimationFrame(animate);
      }

      function openEditor() {
        stopSpeedHold();
        setPlaying(false);
        scriptInput.value = scriptText.textContent;
        editor.classList.add('open');
        scriptInput.focus();
        scriptInput.setSelectionRange(scriptInput.value.length, scriptInput.value.length);
      }

      function closeEditor(save) {
        if (save) {
          updateScript(scriptInput.value);
          prompter.scrollTop = 0;
        }
        editor.classList.remove('open');
        prompter.focus();
      }

      function stopSpeedHold() {
        clearTimeout(holdDelayTimer);
        clearInterval(holdRepeatTimer);
        holdDelayTimer = null;
        holdRepeatTimer = null;
        holdStartedAt = 0;
        heldSpeedKey = null;
      }

      function startSpeedHold(direction) {
        stopSpeedHold();
        holdStartedAt = performance.now();
        changeSpeed(direction, 1);

        holdDelayTimer = setTimeout(() => {
          holdRepeatTimer = setInterval(() => {
            changeSpeed(direction, getHoldMultiplier());
          }, HOLD_REPEAT_MS);
        }, HOLD_DELAY_MS);
      }

      function attachSpeedHoldButton(button, direction) {
        button.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          startSpeedHold(direction);
        });

        const stop = () => stopSpeedHold();
        button.addEventListener('pointerup', stop);
        button.addEventListener('pointercancel', stop);
        button.addEventListener('lostpointercapture', stop);

        // Keyboard activation of the on-screen button still gets a normal step.
        button.addEventListener('click', (event) => {
          if (event.detail === 0) changeSpeed(direction, 1);
        });
      }

      playBtn.addEventListener('click', togglePlay);
      attachSpeedHoldButton(slowerBtn, -1);
      attachSpeedHoldButton(fasterBtn, 1);
      attachManualScrollButton(scrollUpBtn, -1);
      attachManualScrollButton(scrollDownBtn, 1);
      smallerBtn.addEventListener('click', () => changeFontSize(-FONT_STEP));
      largerBtn.addEventListener('click', () => changeFontSize(FONT_STEP));
      fontSelect.addEventListener('change', () => changeFontFamily(fontSelect.value));
      topBtn.addEventListener('click', () => {
        stopSpeedHold();
        setPlaying(false);
        prompter.scrollTop = 0;
      });
      editBtn.addEventListener('click', openEditor);
      cancelEditBtn.addEventListener('click', () => closeEditor(false));
      saveEditBtn.addEventListener('click', () => closeEditor(true));

      document.addEventListener('keydown', (event) => {
        const isEditing = editor.classList.contains('open') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');

        if (isEditing) {
          if (event.key === 'Escape' && editor.classList.contains('open')) {
            event.preventDefault();
            closeEditor(false);
          }
          return;
        }

        if (event.code === 'Space') {
          event.preventDefault();
          togglePlay();
          return;
        }

        if (event.key === 'ArrowUp') {
          event.preventDefault();
          manualScroll(-1, event.repeat ? Math.max(24, Math.round(fontSize * 0.72)) : MANUAL_SCROLL_STEP);
          return;
        }

        if (event.key === 'ArrowDown') {
          event.preventDefault();
          manualScroll(1, event.repeat ? Math.max(24, Math.round(fontSize * 0.72)) : MANUAL_SCROLL_STEP);
          return;
        }

        const zoomModifier = event.ctrlKey || event.metaKey;
        const plusKey = event.key === '+' || event.key === '=';
        const minusKey = event.key === '-' || event.key === '_';

        // Replace browser zoom shortcuts with teleprompter text sizing.
        if (zoomModifier && plusKey) {
          event.preventDefault();
          if (!event.repeat) changeFontSize(FONT_STEP);
          return;
        }

        if (zoomModifier && minusKey) {
          event.preventDefault();
          if (!event.repeat) changeFontSize(-FONT_STEP);
          return;
        }

        if (!zoomModifier && plusKey) {
          event.preventDefault();
          if (!event.repeat) {
            heldSpeedKey = 'plus';
            startSpeedHold(1);
            heldSpeedKey = 'plus';
          }
          return;
        }

        if (!zoomModifier && minusKey) {
          event.preventDefault();
          if (!event.repeat) {
            heldSpeedKey = 'minus';
            startSpeedHold(-1);
            heldSpeedKey = 'minus';
          }
        }
      });

      document.addEventListener('keyup', (event) => {
        const plusKey = event.key === '+' || event.key === '=';
        const minusKey = event.key === '-' || event.key === '_';

        if ((heldSpeedKey === 'plus' && plusKey) || (heldSpeedKey === 'minus' && minusKey)) {
          stopSpeedHold();
        }
      });

      window.addEventListener('blur', () => {
        stopSpeedHold();
        stopManualHold();
      });

      updateScript(getScript());
      updateUI();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
